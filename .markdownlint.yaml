# Relaxed markdownlint rules for writing prose in Neovim.
# Passed to markdownlint-cli2 via --config (see lua/plugins/markdown.lua).
# A project's own .markdownlint* file still layers on top of this.
default: true

# Pure-noise while drafting (prettier also fixes most spacing on save)
MD012: false # multiple consecutive blank lines
MD013: false # line length
MD022: false # blank lines around headings
MD031: false # blank lines around fenced code
MD032: false # blank lines around lists
MD007: false # unordered list indentation
MD009: false # trailing spaces
MD010: false # hard tabs
MD047: false # file must end with newline

# Stylistic opinions that don't matter for notes/docs
MD026: false # trailing punctuation in heading
MD033: false # inline HTML
MD034: false # bare URLs
MD036: false # emphasis used instead of heading
MD040: false # fenced code language
MD041: false # first line must be a top-level heading
MD024: # duplicate headings: only flag duplicates under the same parent
  siblings_only: true

# Still enabled (real structural problems), e.g.:
# MD001 heading levels skip, MD025 multiple H1s, MD042 empty links,
# MD051 broken #fragment links, MD011 reversed link syntax
